<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OOPIF fixture — form</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
      label { display: block; margin: 8px 0; }
      input { display: block; width: 260px; padding: 4px; }
      #result { font-family: ui-monospace, monospace; white-space: pre-wrap; color: #166534; }
    </style>
  </head>
  <body>
    <form id="form">
      <label>First name <input name="first" required /></label>
      <label>Last name <input name="last" required /></label>
      <label>Email <input name="email" type="email" required /></label>
      <button type="submit">Submit Application</button>
    </form>
    <pre id="result"></pre>

    <script>
      const result = document.getElementById("result");
      // keydown, not input: proves the keystrokes were trusted CDP key events and
      // not a value assignment, which is the whole reason for Input.dispatchKeyEvent.
      let keys = 0;
      addEventListener("keydown", () => keys++);
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        result.textContent = `submitted after ${keys} keydowns\n${JSON.stringify(data, null, 2)}`;
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CometClone</title>
    <style>
      :root {
        color-scheme: light dark;
        --edge: color-mix(in srgb, currentColor 15%, transparent);
        --muted: color-mix(in srgb, currentColor 60%, transparent);
        --accent: #f59e0b;
      }
      body {
        margin: 0;
        padding: 12px;
        font: 13px/1.5 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100vh;
        box-sizing: border-box;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        flex: none;
      }
      #dot.up { background: #22c55e; }
      #dot.down { background: #ef4444; }
      #status { font-weight: 400; color: var(--muted); }
      input, button, textarea, select {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--edge);
        background: transparent;
        color: inherit;
      }
      button { cursor: pointer; }
      button:hover:not(:disabled) { background: var(--edge); }
      button:disabled { opacity: 0.4; cursor: default; }
      #prompt, #profile { resize: vertical; width: 100%; box-sizing: border-box; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; }
      /* The dropdown keeps its own width so the three buttons stay equal. */
      #model { flex: none; padding: 6px; }
      #setup { display: none; flex-direction: column; gap: 6px; }
      #setup.show { display: flex; }
      #gate {
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--accent) 15%, transparent);
      }
      #gate.show { display: flex; }
      #gate-action { font-family: ui-monospace, monospace; font-size: 12px; }
      #log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 8px;
        border: 1px solid var(--edge);
        border-radius: 6px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header><span id="dot"></span>CometClone <span id="status">starting…</span></header>

    <div id="setup">
      <label for="token">Paste the token printed by <code>npm start</code>:</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" />
      <button id="save">Save &amp; connect</button>
    </div>

    <details>
      <summary>Profile</summary>
      <textarea id="profile" rows="4" spellcheck="false" placeholder="Name: Ada Lovelace
Email: ada@example.com
Phone: +1 555 0100
Location: Remote
Work authorisation: US citizen"></textarea>
    </details>

    <textarea id="prompt" rows="2" spellcheck="false"
      placeholder="go to google.com, search for cats, open the first result"></textarea>
    <div class="row">
      <select id="model" title="which CLI answers is picked from the model">
        <optgroup label="Claude">
          <option value="sonnet">Sonnet</option>
          <option value="opus">Opus</option>
        </optgroup>
        <optgroup label="Cursor">
          <option value="cursor-grok-4.5-medium">Grok 4.5</option>
          <option value="composer-2.5">Composer 2.5</option>
        </optgroup>
      </select>
      <button id="run">Run</button>
      <button id="reply" disabled title="answer the agent, keeping the last run's context">Reply</button>
      <button id="stop" disabled>Stop</button>
      <button id="ping">Ping</button>
    </div>
    <div id="gate">
      <strong>Approval needed</strong>
      <div id="gate-action"></div>
      <div class="row">
        <button id="gate-approve">Approve</button>
        <button id="gate-deny">Deny</button>
      </div>
    </div>
    <pre id="log"></pre>

    <script type="module" src="panel.js"></script>
  </body>
</html>
